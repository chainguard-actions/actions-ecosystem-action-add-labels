name: Test explicit repo input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          labels: documentation
          repo: actions-ecosystem/action-add-labels
          number: 1
      - name: Assert action ran (succeeded or failed gracefully on non-existent issue)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (issue/PR not found or no permission)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
